name: Real-Time CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 1. Get Latest Code
        uses: actions/checkout@v4
      - name: 2. Setup Pages
        uses: actions/configure-pages@v4
      - name: 3. Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 4. Deploy to Live Internet
        id: deployment
        uses: actions/deploy-pages@v4
